# Runs on every push and pull request: fast unit tests plus a real end-to-end engine run on
# Windows, macOS and Linux (the desktop app's three platforms).
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import static_ffmpeg; static_ffmpeg.add_paths()"
      - name: Scoring formula is in sync
        run: python scripts/export_formula.py --check
      - name: Server tests
        run: python -m unittest tests/test_server.py -v
      - name: Engine unit tests
        run: python -m unittest tests/test_engine_units.py -v
      - name: Web formula tests
        env:
          PYTHON: python
        run: node --test tests/formula.test.mjs
      - name: End-to-end engine run
        run: python tests/ci_smoke.py
